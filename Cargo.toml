[package]
name = "shiperon"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"]}
include-bytes-plus = "1.1.0"
itertools = "0.14.0"
once_cell = "1.21.4"
ron = "0.12.0"
serde = {version = "1.0.192", features = ["derive", "rc"] }
thiserror = "2.0.18"

[dev-dependencies]
insta = { version = "1.46.3", features = ["glob"] }
serde_yaml = "0.9.27"
tempfile = "3.8.1"

[build-dependencies]
rust-bison-skeleton = { version = "0.41.0" }
